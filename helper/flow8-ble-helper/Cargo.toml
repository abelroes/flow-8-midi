[package]
name = "flow8-ble-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
description = "Elevated Windows BLE helper: FLOW 8 over DirectHCI for flow-8-midi"
license = "GPL-3.0-only"

[[bin]]
name = "flow8-ble-helper"
path = "src/main.rs"

[dependencies]
directhci-ble = { path = "../../../DirectHCI/crates/directhci-ble" }
directhci-client = { path = "../../../DirectHCI/crates/directhci-client" }
directhci-windows = { path = "../../../DirectHCI/crates/directhci-windows" }
dirs = "5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
