[package]
name = "flow-8-midi"
version = "2.0.0"
edition = "2021"
authors = ["Abel Rocha Espinosa <abel.espinosa@alumni.usp.br>"]
rust-version = "1.85"
description = "A non-official cross-platform desktop controller for the Behringer FLOW 8 mixer"
repository = "https://github.com/abelroes/flow-8-midi"
license = "GNU GPLv3"
keywords = ["midi", "mixer", "controller", "behringer flow 8", "rust"]

[dependencies]
btleplug = "0.11"
chrono = "0.4"
iced = { version = "^0.14", features = ["tokio"] }
hostname = "0.4"
image = "^0.25.10"
midir = { version = "^0.11.0", features = ["winrt"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-stream = "0.1"
uuid = "1"
rand = "0.8"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.19", optional = true }

[features]
tray = ["tray-icon"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[[bin]]
name = "flow-8-midi"
path = "src/main.rs"

[profile.release]
lto = true
strip = true

[package.metadata.bundle]
name = "FLOW 8 MIDI Controller"
identifier = "br.abelroes.flow-8-midi"
osx_minimum_system_version = "10.11"
icon = ["./resources/icon_32x32.ico"]

[dev-dependencies]
bacon = "^2.18.2"

[build-dependencies]
winresource = "0.1.34"
